[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionbrain-engine"
version = "0.3.0"
description = "Camera-aware, event-driven computer vision engine for webcam, industrial vision and SaaS integration."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Yuri Fernando Dubbern"}]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "Pillow>=10.0",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.4.63"]
vlm = ["transformers>=5.0", "torch>=2.2", "accelerate>=1.0"]
genicam = ["harvesters>=1.4"]
anomaly = ["anomalib>=2.0"]
dashboard = ["streamlit>=1.40", "pandas>=2.2"]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "ruff>=0.8"]
full = [
  "ultralytics>=8.4.63",
  "transformers>=5.0",
  "torch>=2.2",
  "accelerate>=1.0",
  "harvesters>=1.4",
  "anomalib>=2.0",
  "streamlit>=1.40",
  "pandas>=2.2",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
visionbrain = "visionbrain.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
